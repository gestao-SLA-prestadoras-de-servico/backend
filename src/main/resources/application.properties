spring.application.name=backend
spring.datasource.url=jdbc:${DATABASE_TYPE}://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DB}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# Fuso único do sistema (RN-62): Clock e JVM (ClockConfig), sessão JDBC e Hibernate leem o mesmo valor.
app.fuso-horario=${FUSO_HORARIO}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE '${app.fuso-horario}'
spring.jpa.properties.hibernate.jdbc.time_zone=${app.fuso-horario}

# O schema é do Flyway (db/migration); o Hibernate só confere e a aplicação não sobe se divergir.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL}

management.endpoints.web.exposure.include=health,prometheus

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# JWT do Keycloak (RF-01). Com jwk-set-uri não há discovery: o iss só é conferido, e as chaves vêm pela rede interna.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.audiences=app-principal

# CORS: só a origem do frontend.
app.cors.origem=${FRONTEND_URL}

# Admin API do Keycloak (RN-137): conta de serviço app-principal-admin do realm-flowsla.json.
app.keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL}
app.keycloak.admin.realm=flowsla
app.keycloak.admin.client-id=app-principal-admin
app.keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
app.keycloak.admin.connect-timeout=2s
app.keycloak.admin.read-timeout=5s

# Retry só das operações idempotentes (@Retry no KeycloakAdminAdapter) e só em IdpIndisponivelException.
# max-attempts conta a primeira chamada: 3 = 1 chamada + 2 repetições (200 ms e 400 ms).
resilience4j.retry.instances.keycloakAdmin.max-attempts=3
resilience4j.retry.instances.keycloakAdmin.wait-duration=200ms
resilience4j.retry.instances.keycloakAdmin.enable-exponential-backoff=true
resilience4j.retry.instances.keycloakAdmin.exponential-backoff-multiplier=2
resilience4j.retry.instances.keycloakAdmin.retry-exceptions=com.gestaosla.backend.identidade.api.IdpIndisponivelException
