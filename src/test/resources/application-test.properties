spring.application.name=backend


spring.jpa.show-sql=false
app.fuso-horario=America/Fortaleza
# Testes de integração não sobem RabbitMQ; valores locais só para resolver os placeholders.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Tokens assinados pelo TokenTeste e validados pelo mesmo decoder da produção (jwk-set-uri + iss + aud).
# O jwk-set-uri real (JWKS servido pelo próprio TokenTeste) entra pelo TestcontainersConfiguration.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost/realms/flowsla
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/substituido-no-teste
app.cors.origem=http://localhost:5173

# Admin API: os testes que falam com o Keycloak apontam server-url para o container ou servidor simulado.
app.keycloak.admin.server-url=http://localhost:1
app.keycloak.admin.client-secret=s3gredo-teste
app.keycloak.admin.connect-timeout=500ms
app.keycloak.admin.read-timeout=500ms
resilience4j.retry.instances.keycloakAdmin.wait-duration=20ms
