spring.application.name=backend


spring.jpa.show-sql=false
app.fuso-horario=America/Fortaleza
# Testes de integração não sobem RabbitMQ; valores locais só para resolver os placeholders.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Os testes usam tokens montados pelo spring-security-test; o decoder nunca chega a buscar as chaves.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost/realms/flowsla
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/realms/flowsla/protocol/openid-connect/certs
