services:
  backend-app:
    build:
      target: test
    env_file:
      - ../.envs/.env.test

  postgres:
    tmpfs:
      - /var/lib/postgresql/data

  keycloak:
    command: start-dev --import-realm

  prometheus:
    volumes:
      - prometheus-test:/prometheus

  grafana:
    volumes:
      - grafana-test:/var/lib/grafana

volumes:
  prometheus-test:
  grafana-test:
