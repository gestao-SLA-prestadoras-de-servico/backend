services:
  backend-app:
    build:
      target: development
    volumes:
      - ..:/app:z
    env_file:
      - ../.envs/.env.dev

  postgres:
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  rabbitmq:
    ports:
      - "15672:15672" # management
    volumes:
      - rabbitmq-dev:/var/lib/rabbitmq

  minio:
    ports:
      - "9001:9001" # console (a porta S3 9000 não é publicada)
    volumes:
      - minio-dev:/data

  keycloak:
    command: start-dev --import-realm
    environment:
      # O navegador emite o token por localhost:8081 (iss); o backend busca as chaves por keycloak:8080.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8081:8080"

  mailpit:
    ports:
      - "8025:8025" # interface web

  prometheus:
    volumes:
      - prometheus-dev:/prometheus

  grafana:
    volumes:
      - grafana-dev:/var/lib/grafana

  # Repositório irmão ../../ms-notifications. Host 8082, porque a 8081 do host é do Keycloak.
  ms-notificacoes:
    profiles: [ms] # fora do CI: o contexto de build é outro repositório
    build:
      context: ../../ms-notifications
    environment:
      SERVER_PORT: 8081
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}
      DB_URL: jdbc:postgresql://postgres:5432/notificacoes
      DB_USERNAME: ${NOTIFICACOES_DB_USER}
      DB_PASSWORD: ${NOTIFICACOES_DB_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MAIL_HOST: ${SMTP_HOST}
      MAIL_PORT: ${SMTP_PORT}
    ports:
      - "8082:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy

volumes:
  pgdata-dev:
  rabbitmq-dev:
  minio-dev:
  prometheus-dev:
  grafana-dev:
