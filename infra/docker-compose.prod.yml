services:
  backend-app:
    build:
      target: production
    env_file:
      - ../.envs/.env.prod

  postgres:
    volumes:
      - pgdata-prod:/var/lib/postgresql/data

  rabbitmq:
    volumes:
      - rabbitmq-prod:/var/lib/rabbitmq

  minio:
    volumes:
      - minio-prod:/data

  prometheus:
    volumes:
      - prometheus-prod:/prometheus

  grafana:
    volumes:
      - grafana-prod:/var/lib/grafana

volumes:
  pgdata-prod:
  rabbitmq-prod:
  minio-prod:
  prometheus-prod:
  grafana-prod:
