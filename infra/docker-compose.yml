services:
  backend-app:
    build:
      context: ..
    ports:
      - "${LOCAL_PORT}:${DOCKER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      NOTIFICACOES_DB_USER: ${NOTIFICACOES_DB_USER}
      NOTIFICACOES_DB_PASSWORD: ${NOTIFICACOES_DB_PASSWORD}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER}"]
      interval: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro,z
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro,z
    # Importa a topologia depois do boot: com load_definitions o RabbitMQ não cria o RABBITMQ_DEFAULT_USER.
    post_start:
      - user: rabbitmq # como root, o CLI criaria o .erlang.cookie com dono errado
        command: sh -c 'until rabbitmq-diagnostics -q ping; do sleep 2; done; rabbitmqctl import_definitions /etc/rabbitmq/definitions.json && touch /tmp/definitions-importadas'
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && test -f /tmp/definitions-importadas"]
      interval: 5s
      retries: 12

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    depends_on:
      postgres:
        condition: service_healthy
    # A imagem não tem curl; usa /dev/tcp do bash na porta de gerenciamento.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      retries: 18

  mailpit:
    image: axllent/mailpit:v1.27
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      retries: 5

networks:
  default:
    name: flowsla-${ENVIRONMENT}
