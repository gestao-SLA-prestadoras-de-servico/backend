services:
  backend-app:
    build:
      context: ..
    # Os overlays carregam o arquivo de ambiente inteiro no backend.
    environment:
      KEYCLOAK_METRICS_CLIENT_SECRET: ""
      GRAFANA_ADMIN_PASSWORD: ""
    ports:
      - "${LOCAL_PORT}:${DOCKER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      TZ: ${FUSO_HORARIO} # o initdb grava como timezone padrão do servidor (só em volume novo)
      PGTZ: ${FUSO_HORARIO} # psql dentro do container
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      NOTIFICACOES_DB_USER: ${NOTIFICACOES_DB_USER}
      NOTIFICACOES_DB_PASSWORD: ${NOTIFICACOES_DB_PASSWORD}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER}"]
      interval: 5s
      retries: 5

  rabbitmq-init:
    image: python:3.13-alpine
    working_dir: /app
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - ./rabbitmq:/rabbitmq
      - ./rabbitmq/generate_definitions.py:/app/generate_definitions.py:ro,z
    command: ["python", "/app/generate_definitions.py"]

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro,z
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro,z
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro,z
      # - rabbitmq/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      retries: 12

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    # Importa infra/keycloak/realm-flowsla.json só se o realm ainda não existir no banco.
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Lidas pelos placeholders ${...} do realm-flowsla.json no import.
      FRONTEND_URL: ${FRONTEND_URL}
      SWAGGER_URL: ${SWAGGER_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      KEYCLOAK_GESTOR_PASSWORD: ${KEYCLOAK_GESTOR_PASSWORD}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_METRICS_CLIENT_SECRET: ${KEYCLOAK_METRICS_CLIENT_SECRET:?Defina KEYCLOAK_METRICS_CLIENT_SECRET no arquivo de ambiente}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro,z
    depends_on:
      postgres:
        condition: service_healthy
    # A imagem não tem curl; usa /dev/tcp do bash na porta de gerenciamento.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 10s
      retries: 18

  mailpit:
    image: axllent/mailpit:v1.27
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    ports:
      - "127.0.0.1:${PROMETHEUS_LOCAL_PORT:-19090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
    secrets:
      - metrics_oauth_client_secret
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://127.0.0.1:9090"]
      interval: 10s
      timeout: 5s
      retries: 6

  grafana:
    image: grafana/grafana:13.3.2
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ ! -s "$$GF_SECURITY_ADMIN_PASSWORD__FILE" ]; then
          echo 'Defina GRAFANA_ADMIN_PASSWORD no arquivo de ambiente' >&2
          exit 1
        fi
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Defina GRAFANA_ADMIN_USER no arquivo de ambiente}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_LOCAL_PORT:-13000}:3000"
    volumes:
      - ./grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro,z
    secrets:
      - grafana_admin_password
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      start_period: 360s
      interval: 10s
      timeout: 5s
      retries: 6

secrets:
  metrics_oauth_client_secret:
    environment: KEYCLOAK_METRICS_CLIENT_SECRET
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

networks:
  default:
    name: flowsla-${ENVIRONMENT}
